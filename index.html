<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRA UMA PESSOA ESPECIAL ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #fce7f3 0%, #ffffff 50%, #fecdd3 100%);
            font-family: 'Poppins', sans-serif;
            color: #590d22;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .hearts-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .heart {
            position: absolute;
            font-size: 2rem;
            opacity: 0.3;
            animation: float 6s infinite ease-in;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0.3;
            }
            50% {
                opacity: 0.5;
            }
            100% {
                transform: translateY(-10vh) rotate(360deg);
                opacity: 0;
            }
        }

        .container {
            position: relative;
            z-index: 10;
            max-width: 700px;
            width: 100%;
        }

        /* Tela de entrada */
        .welcome-screen {
            background: white;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(255, 77, 109, 0.2);
            padding: 40px 30px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .welcome-screen.hidden {
            display: none;
        }

        .welcome-header {
            background: linear-gradient(135deg, #f472b6 0%, #ec4899 50%, #f43f5e 100%);
            padding: 30px;
            border-radius: 20px;
            margin: -40px -30px 0 -30px;
        }

        .welcome-header h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 2.5rem;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .welcome-text {
            font-size: 1.1rem;
            color: #666;
            line-height: 1.6;
        }

        .name-input {
            width: 100%;
            padding: 15px;
            border: 2px solid #fbcfe8;
            border-radius: 12px;
            font-size: 1rem;
            font-family: 'Poppins', sans-serif;
            text-align: center;
            transition: all 0.3s;
        }

        .name-input:focus {
            outline: none;
            border-color: #f472b6;
            box-shadow: 0 0 0 3px rgba(244, 114, 182, 0.1);
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Poppins', sans-serif;
        }

        .btn-primary {
            background: linear-gradient(135deg, #f472b6 0%, #ec4899 100%);
            color: white;
            width: 100%;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(244, 114, 182, 0.3);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Tela da cartinha */
        .letter-screen {
            background: white;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(255, 77, 109, 0.2);
            overflow: hidden;
            display: none;
        }

        .letter-screen.active {
            display: block;
        }

        .letter-header {
            background: linear-gradient(135deg, #f472b6 0%, #ec4899 50%, #f43f5e 100%);
            padding: 40px 30px;
            text-align: center;
        }

        .letter-header h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 2.2rem;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            line-height: 1.3;
        }

        .letter-content {
            padding: 40px 30px;
            max-height: 70vh;
            overflow-y: auto;
        }

        .letter-text {
            font-size: 1.15rem;
            line-height: 1.8;
            color: #555;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 500;
        }

        .letter-text:last-child {
            margin-bottom: 0;
        }

        .questions-section {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 2px solid #fbcfe8;
        }

        .questions-title {
            text-align: center;
            font-size: 1.5rem;
            font-weight: 600;
            color: #f472b6;
            margin-bottom: 30px;
        }

        .question-group {
            margin-bottom: 20px;
        }

        .question-label {
            display: block;
            font-weight: 600;
            color: #f472b6;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        .question-input, .question-select, .question-textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #fbcfe8;
            border-radius: 8px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.95rem;
            transition: all 0.3s;
        }

        .question-select, .question-input, .question-textarea {
            background: white;
        }

        .question-input:focus, .question-select:focus, .question-textarea:focus {
            outline: none;
            border-color: #f472b6;
            box-shadow: 0 0 0 2px rgba(244, 114, 182, 0.1);
        }

        .question-textarea {
            resize: vertical;
            min-height: 60px;
        }

        .btn-send {
            width: 100%;
            background: #22c55e;
            color: white;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 30px;
            transition: all 0.3s;
            font-family: 'Poppins', sans-serif;
        }

        .btn-send:hover {
            background: #16a34a;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(34, 197, 94, 0.3);
        }

        .signature {
            text-align: right;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #fbcfe8;
        }

        .signature-name {
            font-family: 'Dancing Script', cursive;
            font-size: 1.8rem;
            color: #f472b6;
            margin-bottom: 5px;
        }

        .signature-from {
            font-size: 1.1rem;
            color: #f472b6;
            font-weight: 600;
        }

        @media (max-width: 600px) {
            .welcome-screen, .letter-header, .letter-content {
                padding: 25px 20px;
            }

            .welcome-header {
                margin: -25px -20px 0 -20px;
            }

            .welcome-header h1 {
                font-size: 1.8rem;
            }

            .letter-header h1 {
                font-size: 1.5rem;
            }

            .letter-text {
                font-size: 1rem;
            }
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        ::-webkit-scrollbar-thumb {
            background: #f472b6;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="hearts-bg" id="heartsContainer"></div>

    <div class="container">
        <!-- Tela de Boas-vindas -->
        <div class="welcome-screen" id="welcomeScreen">
            <div class="welcome-header">
                <h1>❤️ Quem é você? ❤️</h1>
            </div>
            <p class="welcome-text">Me diz seu nome para eu ler essa cartinha especial pra você 💕</p>
            <input 
                type="text" 
                class="name-input" 
                id="nameInput" 
                placeholder="Seu nome aqui..."
    id="nameInput" 
                autocomplete="off"
            >
            <button class="btn btn-primary" onclick="startLetter()">Continuar 💕</button>
        </div>

        <!-- Tela da Cartinha -->
        <div class="letter-screen" id="letterScreen">
            <div class="letter-header">
                <h1>🌅❤️ BOM DIA, <span id="nameDisplay">AMOR</span> ❤️😍</h1>
            </div>

            <div class="letter-content">
                <p class="letter-text">😏💭 Hoje é quele dia que Deus acordou e ordenou:</p>
                <p class="letter-text" style="color: #f472b6; font-weight: 600; font-size: 1.3rem;">*Sorria menina, Porque hoje você vai arrasar*!! 😌</p>
                <p class="letter-text">Bom dia! ☕🍞</p>

                <div class="questions-section">
                    <div class="questions-title">Responde aqui pra mim, bb? 🥺❤️</div>

                    <div class="question-group">
                        <label class="question-label">Dormiu bem, amore? ❤️🥺</label>
                        <select class="question-select" id="q1">
                            <option value="">Selecione...</option>
                            <option value="Sim, muito bem!">Sim, muito bem! ❤️</option>
                            <option value="Mais ou menos...">Mais ou menos... 🥺</option>
                            <option value="Não muito...">Não muito... 💔</option>
                        </select>
                    </div>

                    <div class="question-group">
                        <label class="question-label">Acordou bem? ❤️🥺</label>
                        <select class="question-select" id="q2">
                            <option value="">Selecione...</option>
                            <option value="Sim, acordei ótima!">Sim, acordei ótima! 😊</option>
                            <option value="Com um pouco de sono...">Com um pouco de sono... 😴</option>
                        </select>
                    </div>

                    <div class="question-group">
                        <label class="question-label">Já tomou banho? ❤️</label>
                        <select class="question-select" id="q3">
                            <option value="">Selecione...</option>
                            <option value="Sim, já tomei!">Sim, já tomei! 🚿</option>
                            <option value="Ainda não...">Ainda não... 🧼</option>
                        </select>
                    </div>

                    <div class="question-group">
                        <label class="question-label">Já escovou os dentinhos? ❤️😁</label>
                        <select class="question-select" id="q4">
                            <option value="">Selecione...</option>
                            <option value="Sim, estão limpinhos!">Sim, estão limpinhos! ✨</option>
                            <option value="Vou escovar agora!">Vou escovar agora! 🪥</option>
                        </select>
                    </div>

                    <div class="question-group">
                        <label class="question-label">Já tomou café? ☕❤️</label>
                        <select class="question-select" id="q5">
                            <option value="">Selecione...</option>
                            <option value="Sim, já tomei!">Sim, já tomei! ☕</option>
                            <option value="Ainda não...">Ainda não... 🍞</option>
                        </select>
                    </div>

                    <div class="question-group">
                        <label class="question-label">Fez xixi? 🤭❤️</label>
                        <select class="question-select" id="q6">
                            <option value="">Selecione...</option>
                            <option value="Sim, fiz! kkk">Sim, fiz! kkk 😂</option>
                            <option value="Ainda não...">Ainda não... 🚽</option>
                        </select>
                    </div>

                    <div class="question-group">
                        <label class="question-label">Já colocou comida para o neném? 👶❤️</label>
                        <select class="question-select" id="q7">
                            <option value="">Selecione...</option>
                            <option value="Sim, já coloquei!">Sim, já coloquei! 🍼</option>
                            <option value="Vou colocar agora!">Vou colocar agora! 👶</option>
                        </select>
                    </div>

                    <div class="question-group">
                        <label class="question-label">Fez uma oração? 🙏❤️</label>
                        <select class="question-select" id="q8">
                            <option value="">Selecione...</option>
                            <option value="Sim, agradeci a Deus!">Sim, agradeci a Deus! 🙏</option>
                            <option value="Vou fazer agora!">Vou fazer agora! ✨</option>
                        </select>
                    </div>

                    <div class="question-group">
                        <label class="question-label">Como foi sua noite? ❤️🥰</label>
                        <textarea class="question-textarea" id="q9" placeholder="Conta pra mim..."></textarea>
                    </div>

                    <div class="question-group">
                        <label class="question-label">E como está sendo seu dia, bb? ❤️🥰😊</label>
                        <textarea class="question-textarea" id="q10" placeholder="Como está indo?"></textarea>
                    </div>
                </div>

                <button class="btn-send" onclick="sendToWhatsApp()">Enviar Respostas para o Rubens 🚀❤️</button>

                <div class="signature">
                    <div class="signature-from">Com todo meu amor,</div>
                    <div class="signature-name">Rubens ❤️</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Gerar corações flutuantes
        function createFloatingHearts() {
            const container = document.getElementById('heartsContainer');
            for (let i = 0; i < 10; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart';
                heart.textContent = '❤️';
                heart.style.left = Math.random() * 100 + '%';
                heart.style.animationDelay = Math.random() * 2 + 's';
                heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
                container.appendChild(heart);
            }
        }

        // Iniciar a cartinha
        function startLetter() {
            const nameInput = document.getElementById('nameInput');
            const name = nameInput.value.trim();

            if (!name) {
                alert('Por favor, digite seu nome! 💕');
                return;
            }

            document.getElementById('welcomeScreen').classList.add('hidden');
            document.getElementById('letterScreen').classList.add('active');
            document.getElementById('nameDisplay').textContent = name.toUpperCase();
        }

        // Permitir Enter para iniciar
        document.addEventListener('DOMContentLoaded', function() {
            createFloatingHearts();
            
            const nameInput = document.getElementById('nameInput');
            nameInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    startLetter();
                }
            });
        });

        // Enviar para WhatsApp
        function sendToWhatsApp() {
            const name = document.getElementById('nameDisplay').textContent;
            const phone = '5581989501999';

            const responses = {
                q1: document.getElementById('q1').value || 'Não respondeu',
                q2: document.getElementById('q2').value || 'Não respondeu',
                q3: document.getElementById('q3').value || 'Não respondeu',
                q4: document.getElementById('q4').value || 'Não respondeu',
                q5: document.getElementById('q5').value || 'Não respondeu',
                q6: document.getElementById('q6').value || 'Não respondeu',
                q7: document.getElementById('q7').value || 'Não respondeu',
                q8: document.getElementById('q8').value || 'Não respondeu',
                q9: document.getElementById('q9').value || 'Não respondeu',
                q10: document.getElementById('q10').value || 'Não respondeu'
            };

            let texto = `*Respostas de ${name} para o Rubens* ❤️\n\n`;
            texto += `*Dormiu bem?* ${responses.q1}\n`;
            texto += `*Acordou bem?* ${responses.q2}\n`;
            texto += `*Já tomou banho?* ${responses.q3}\n`;
            texto += `*Escovou os dentes?* ${responses.q4}\n`;
            texto += `*Tomou café?* ${responses.q5}\n`;
            texto += `*Fez xixi?* ${responses.q6}\n`;
            texto += `*Comida do neném?* ${responses.q7}\n`;
            texto += `*Fez oração?* ${responses.q8}\n`;
            texto += `*Como foi a noite?* ${responses.q9}\n`;
            texto += `*Como está o dia?* ${responses.q10}`;

            const encodedText = encodeURIComponent(texto);
            const url = `https://wa.me/${phone}?text=${encodedText}`;

            window.open(url, '_blank');
        }
    </script>
</body>
</html>
