<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para você</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
            --accent-color: #ff4d6d;
            --text-main: #4a1525;
            --text-muted: #8c5260;
            --bg-glass: rgba(255, 255, 255, 0.88);
            --border-color: rgba(255, 117, 140, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1a050a 0%, #4a1525 50%, #2d0b14 100%);
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .hearts-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .heart {
            position: absolute;
            font-size: 1.5rem;
            opacity: 0.15;
            animation: float 8s infinite linear;
        }

        @keyframes float {
            0% {
                transform: translateY(105vh) rotate(0deg) scale(0.8);
            }
            50% {
                opacity: 0.3;
                transform: translateY(50vh) rotate(180deg) scale(1.2);
            }
            100% {
                transform: translateY(-10vh) rotate(360deg) scale(0.8);
                opacity: 0;
            }
        }

        .container {
            position: relative;
            z-index: 10;
            max-width: 680px;
            width: 100%;
        }

        /* Tela de entrada */
        .welcome-screen {
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 28px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
            padding: 45px 35px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 25px;
            animation: fadeIn 0.8s ease-out;
        }

        .welcome-screen.hidden {
            display: none !important;
        }

        .welcome-header h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 3rem;
            color: var(--accent-color);
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(255, 77, 109, 0.2);
        }

        .welcome-text {
            font-size: 1.05rem;
            color: var(--text-muted);
            line-height: 1.6;
        }

        .name-input {
            width: 100%;
            padding: 16px 20px;
            border: 2px solid var(--border-color);
            border-radius: 16px;
            font-size: 1.05rem;
            font-family: 'Plus Jakarta Sans', sans-serif;
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            color: var(--text-main);
            transition: all 0.3s ease;
        }

        .name-input:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 4px rgba(255, 77, 109, 0.15);
            background: #fff;
        }

        .btn {
            padding: 16px 30px;
            border: none;
            border-radius: 16px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .btn-primary {
            background: var(--primary-gradient);
            color: white;
            width: 100%;
            box-shadow: 0 10px 20px rgba(255, 77, 109, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px rgba(255, 77, 109, 0.4);
        }

        /* Tela da cartinha */
        .letter-screen {
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 28px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
            overflow: hidden;
            display: none;
            animation: fadeIn 0.8s ease-out;
        }

        .letter-screen.active {
            display: block !important;
        }

        .letter-header {
            background: var(--primary-gradient);
            padding: 35px 30px;
            text-align: center;
        }

        .letter-header h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 2.4rem;
            color: white;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            line-height: 1.3;
        }

        .letter-content {
            padding: 35px 30px;
            max-height: 70vh;
            overflow-y: auto;
        }

        .letter-text {
            font-size: 1.05rem;
            line-height: 1.8;
            color: var(--text-muted);
            margin-bottom: 18px;
            text-align: justify;
            font-weight: 500;
        }

        .questions-section {
            margin-top: 35px;
            padding-top: 30px;
            border-top: 2px dashed var(--border-color);
        }

        .questions-title {
            text-align: center;
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--accent-color);
            margin-bottom: 25px;
        }

        .question-group {
            margin-bottom: 22px;
        }

        .question-label {
            display: block;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        .question-select, .question-textarea {
            width: 100%;
            padding: 14px;
            border: 1.5px solid var(--border-color);
            border-radius: 14px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.9);
            color: var(--text-main);
        }

        .question-select:focus, .question-textarea:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 4px rgba(255, 77, 109, 0.1);
            background: #fff;
        }

        .question-textarea {
            resize: vertical;
            min-height: 80px;
        }

        .btn-send {
            width: 100%;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            padding: 16px;
            border: none;
            border-radius: 14px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 30px;
            transition: all 0.3s ease;
            font-family: 'Plus Jakarta Sans', sans-serif;
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.3);
        }

        .btn-send:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px rgba(16, 185, 129, 0.4);
        }

        .signature {
            text-align: right;
            margin-top: 35px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }

        .signature-name {
            font-family: 'Dancing Script', cursive;
            font-size: 2rem;
            color: var(--accent-color);
        }

        .signature-from {
            font-size: 0.95rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 600px) {
            .welcome-screen, .letter-content {
                padding: 25px 20px;
            }
            .welcome-header h1 {
                font-size: 2.5rem;
            }
            .letter-header h1 {
                font-size: 1.8rem;
            }
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.05);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--accent-color);
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="hearts-bg" id="heartsContainer"></div>

    <div class="container">

        <div class="welcome-screen" id="welcomeScreen">
            <div
